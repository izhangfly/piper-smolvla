[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-smolvla"
version = "0.1.0"
description = "Fine-tune and run LeRobot's SmolVLA vision-language-action policy on an AgileX PiPER arm"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ian Zhang (izhangfly)" }]
requires-python = ">=3.10"
keywords = ["robotics", "lerobot", "smolvla", "vla", "agilex", "piper", "imitation-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The robot side (piper-smolvla run) needs LeRobot's async client only; training and serving need SmolVLA.
dependencies = ["lerobot[async]==0.4.4"]

[project.optional-dependencies]
smolvla = ["lerobot[smolvla,async]==0.4.4"]
test = ["pytest>=8"]

[project.scripts]
piper-smolvla = "piper_smolvla.cli:main"

[project.urls]
Homepage = "https://github.com/izhangfly/piper-smolvla"

[tool.setuptools]
packages = ["piper_smolvla"]

[tool.setuptools.package-data]
piper_smolvla = ["env/*.txt", "env/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a small LeRobot dataset with video (a few seconds)"]
